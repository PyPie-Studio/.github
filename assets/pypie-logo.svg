<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190a32"/>
      <stop offset="100%" stop-color="#0b0417"/>
    </linearGradient>
    <linearGradient id="p_stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e9d5ff"/>
      <stop offset="60%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="p_loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="i_stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle Frame -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#bg_grad)" stroke="#371861" stroke-width="2.5"/>

  <!-- Left Stem of P -->
  <rect x="42" y="38" width="24" height="124" rx="6" fill="url(#p_stem)" filter="url(#glow)"/>

  <!-- P Beveled Outer Loop -->
  <path d="M 66 38 L 138 38 
           L 160 60 L 160 100 
           L 138 122 L 66 122 
           L 66 98 L 128 98 
           L 136 90 L 136 70 
           L 128 62 L 66 62 Z" 
        fill="url(#p_loop)" filter="url(#glow)"/>

  <!-- Centered "I" Pillar (Centered at X = 100) -->
  <rect x="89" y="122" width="22" height="40" rx="5" fill="url(#i_stem)" filter="url(#glow)"/>

  <!-- Centered Diamond Dot (Centered at X = 100, Y = 80) -->
  <polygon points="100,68 112,80 100,92 88,80" fill="#ffffff" filter="url(#glow)"/>
  <polygon points="100,72 108,80 100,88 92,80" fill="#f3e8ff"/>
</svg>
